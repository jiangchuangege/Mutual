chor="middle" font-family="Microsoft YaHei" font-size="13" fill="#DCE6F5">乐观更新+服务端投影</text><rect x="365" y="630" width="230" height="120" rx="9" fill="#0B3D91" stroke="#64B5F6" stroke-width="2.5"/><text x="480" y="662" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="bold" fill="#FFFFFF">🎨 UI 层</text><text x="480" y="690" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" fill="#DCE6F5">AppFrame 壁纸</text><text x="480" y="710" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" fill="#DCE6F5">Aurora 玻璃卡片</text><rect x="115" y="766" width="480" height="40" rx="9" fill="#0B3D91" stroke="#64B5F6" stroke-width="2.5"/><text x="355" y="798" text-anchor="middle" font-family="Microsoft YaHei" font-size="14" font-weight="bold" fill="#FFFFFF">播放器（expo-video / expo-audio）真实进度回写 store</text><rect x="90" y="850" width="520" height="340" rx="12" fill="#1B5E20" stroke="#A5D6A7" stroke-width="2.5"/><text x="350" y="882" text-anchor="middle" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#FFFFFF">💾 本机存储（缓存优先 · 永久）</text><rect x="112" y="900" width="476" height="60" rx="9" fill="#2E7D32" stroke="#A5D6A7" stroke-width="2.5"/><text x="350" y="932" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" font-weight="bold" fill="#FFFFFF">📦 文件缓存 cmscache/*.json</text><text x="350" y="960" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" fill="#DCE6F5">cmsApi:&lt;源&gt; · cmsApiDeep:p:&lt;源&gt;:&lt;页&gt;（一页一片）</text><rect x="112" y="970" width="476" height="60" rx="9" fill="#2E7D32" stroke="#A5D6A7" stroke-width="2.5"/><text x="350" y="1002" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" font-weight="bold" fill="#FFFFFF">🌱 APK 内置种子缓存 45MB</text><text x="350" y="1030" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" fill="#DCE6F5">首启就有内容 · 只读</text><rect x="112" y="1040" width="476" height="60" rx="9" fill="#2E7D32" stroke="#A5D6A7" stroke-width="2.5"/><text x="350" y="1072" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" font-weight="bold" fill="#FFFFFF">🔒 原子写 .tmp + move</text><text x="350" y="1100" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" fill="#DCE6F5">断电不坏 · 并发不交叉</text><rect x="112" y="1110" width="476" height="60" rx="9" fill="#2E7D32" stroke="#A5D6A7" stroke-width="2.5"/><text x="350" y="1142" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" font-weight="bold" fill="#FFFFFF">🗂 AsyncStorage 小配置</text><text x="350" y="1170" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" fill="#DCE6F5">账号会话 · 源列表 · 已删名单</text><rect x="690" y="300" width="400" height="520" rx="12" fill="#E65100" stroke="#FFB74D" stroke-width="2.5"/><text x="890" y="332" text-anchor="middle" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#FFFFFF">🔗 同步层（客户端）</text><rect x="712" y="350" width="356" height="64" rx="9" fill="#EF6C00" stroke="#FFB74D" stroke-width="2.5"/><text x="890" y="382" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="bold" fill="#FFFFFF">WebSocket 长连接（主）</text><text x="890" y="410" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" fill="#DCE6F5">hello 报身份 · RPC · 服务端推送</text><rect x="712" y="424" width="356" height="64" rx="9" fill="#EF6C00" stroke="#FFB74D" stroke-width="2.5"/><text x="890" y="456" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="bold" fill="#FFFFFF">HTTP 长轮询 /api/wait（兜底）</text><text x="890" y="484" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" fill="#DCE6F5">长连接不可用自动降级</text><rect x="712" y="498" width="356" height="64" rx="9" fill="#EF6C00" stroke="#FFB74D" stroke-width="2.5"/><text x="890" y="530" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="bold" fill="#FFFFFF">/api/rpc 写操作</text><text x="890" y="558" text-anchor="middle" font-family="Microsoft YaHei" font-size="13" fill="